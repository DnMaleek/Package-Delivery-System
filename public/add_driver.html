<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDSys | Add-Driver</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: rgb(234, 234, 234);
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}

/* ===== MAIN WRAPPER ===== */
.container {
    width: 100%;
    max-width: 600px;
}

/* ===== FORM CARD ===== */
form {
    background: rgb(249, 249, 249);
    border-radius: 16px;
    border: 1px solid rgb(230, 228, 240);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);

    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 30px;
}

/* ===== HEADINGS ===== */
h2 {
    font-size: 22px;
}

h4, h5 {
    margin-bottom: 10px;
}

/* ===== SECTIONS ===== */
.part,
.part1 {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* ===== INPUT GROUP ===== */
.inputs {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.inp {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

label {
    font-size: 14px;
}

/* ===== ROW LAYOUT FOR COMPANY / FROM / TO ===== */
.inputs-row {
    display: flex;
    gap: 15px;
    width: 100%;
}

.inputs-row .inp {
    flex: 1;
    min-width: 0; /* 🔥 important fix */
}

/* ===== INPUT STYLE ===== */
input {
    height: 42px;
    font-size: 14px;
    padding: 0 12px;

    border-radius: 10px;
    border: 1px solid rgb(236, 236, 236);
    outline-color: rgb(70, 157, 207);
}

/* ===== BUTTON ===== */
.submit {
    display: flex;
    justify-content: center;
}

.submit button {
    padding: 10px 30px;
    min-width: 160px;
    border-radius: 10px;
    border: 1px solid rgb(233, 233, 233);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
    .inputs-row {
        flex-direction: column;
    }
}
</style>
<body>
        <div class="container">
        <form id="driverForm">
            <h2>Register Driver Here</h2>
            <div class="part">
                <h4>Driver Details</h4>
                <div class="inputs">
                    <div class="inp">
                        <label for="fullname">Full Name</label>
                        <input type="text" name="fullname" id="fullname" placeholder="eg. John Doe">
                    </div>
                    <div class="inp">
                        <label for="phone">Phone Number</label>
                        <input type="text" name="phone" id="phone" placeholder="eg. +255 750 000 000">
                    </div>
                </div>
            </div>

            <div class="part1">
                <h5>Transport Information</h5>
               <div class="inputs-row">
                    <div class="inp">
                        <label for="company">Company</label>
                        <input type="text" name="company" id="company" placeholder="Company">
                    </div>

                    <div class="inp">
                        <label for="from">From</label>
                        <input type="text" name="from" id="from" placeholder="Origin">
                    </div>

                    <div class="inp">
                        <label for="to">To</label>
                        <input type="text" name="to" id="to" placeholder="Destination">
                    </div>
                </div>
            </div>
            
            <div class="submit">
                <button type="submit">Add Driver</button>
            </div>       
        </form>
    </div>

    <script>

     document.getElementById('driverForm').addEventListener('submit',(e) => {
            e.preventDefault();

        const fullname = document.getElementById('fullname').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const company = document.getElementById('company').value.trim();
        const from = document.getElementById('from').value.trim();
        const to = document.getElementById('to').value.trim();

        const driver = {fullname, phone, company, from, to};
        let xhr = new XMLHttpRequest()

        xhr.open("POST", "../src/logics/add_driver.php", true);
        xhr.setRequestHeader("Content-Type","application/json");

        xhr.onload = function () {
            if (xhr.status === 200) {
                let data = JSON.parse(xhr.responseText);
                console.log (data)
            } else {
                console.error("Error",xhr.status);
            }
        }

        xhr.send(JSON.stringify(driver));

        });
    </script>

</body>
</html>
