<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>PDSys | Add-Parcel</title>
</head>
<style>
 * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: rgb(234, 234, 234);
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px 20px;
}

/* ===== CONTAINER ===== */
.container {
    width: 100%;
    max-width: 750px;
}

/* ===== FORM CARD ===== */
form {
    background: rgb(249, 249, 249);
    border-radius: 16px;
    border: 1px solid rgb(230, 228, 240);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);

    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 30px;
}

/* ===== SECTION STRUCTURE ===== */
.part {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.part > p {
    font-weight: 500;
}

/* ===== INPUT ROWS ===== */
.inputs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

/* ===== INPUT STYLE ===== */
input {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    font-size: 14px;

    border-radius: 10px;
    border: 1px solid rgb(236, 236, 236);
    outline-color: rgb(70, 157, 207);
}

/* ===== DESCRIPTION SECTION ===== */
.desc {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.input-field {
    height: 180px;
    border: 2px dashed rgb(200, 200, 200);
    border-radius: 16px;

    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.input-field i {
    font-size: 40px;
    margin-bottom: 10px;
}

.desc textarea {
    resize: none;
    width: 100%;
    height: 100px;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;

    border-radius: 10px;
    border: 1px solid rgb(236, 236, 236);
    outline-color: rgb(70, 157, 207);
}

/* ===== BUTTON ===== */
.submit {
    display: flex;
    justify-content: center;
}

.submit button {
    padding: 10px 35px;
    min-width: 180px;
    border-radius: 10px;
    border: 1px solid rgb(233, 233, 233);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 650px) {
    .inputs {
        grid-template-columns: 1fr;
    }
}
</style>
<body>
    <div class="container">
        <form action="#">
            <h2>Add Parcel Here</h2>
            <div class="part">
                <p>Senders Information</p>
                <div class="inputs">
                    <input type="text" name="name" placeholder="Name">
                    <input type="tel" name="phone" placeholder="Contact">
                </div>
            </div>
            <div class="part">
                <p>Receiver Information</p>
                <div class="inputs">
                    <input type="text" name="name" placeholder="Name">
                    <input type="tel" name="phone" placeholder="Contact">
                </div>
            </div>
            <div class="part">
                <p>Route Information</p>
                <div class="inputs">
                    <input type="text" name="from-loc" placeholder="From">
                    <input type="text" name="dest-loc" placeholder="Destination">
                </div>
            </div>
            <div>
                <p>Parcel Description</p>
                <div class="desc">
                    <div class="input-field">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <p>Click To Upload</p>
                        <input type="file" name="parcel-image" placeholder="Parcel Image" hidden>
                    </div>
                    <textarea type="text" name="parcel-info" rows="3">
                    </textarea>
                </div>
            </div>
            <div class="submit">
                <button type="submit">Add Parcel</button>
            </div>       
        </form>
    </div>
    <script>
        const inputField = document.querySelector('.input-field');
        const fileInput = document.querySelector('input[type="file"]');

        inputField.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                inputField.innerHTML = `<p style="color: rgb(70, 157, 207);">${fileInput.files[0].name} selected</p>`;
            } else {
                inputField.innerHTML = `<p>Click To Upload</p>`;
            }
        });
    </script>
</body>
</html>
